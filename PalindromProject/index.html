<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome checker freecode</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Pacifico&display=swap" rel="stylesheet">

">
</head>
<body>
    <h1>Is it a Palindorme?</h1>
    <div class="container">
        <div class="checker">
            <p>Enter in text to check for a palindrome:</p>
            <button class="check" id ="check-btn">Check</button>
            <input class="input-class" id="text-input">
            <span id="result" class="result"></span>
        </div>
        <div class="text-container">
            <p>A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
        </div>
    </div>
    <script src="./script.js"></script>
    
</body>
</html>
